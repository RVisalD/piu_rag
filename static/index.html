<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParagonU Assistant</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      color: #203333;
      background: #f3f6f4;
      --ink: #203333;
      --muted: #71807d;
      --line: #dce5e1;
      --brand: #192f59;
      --brand-dark: #122345;
      --accent: #c36545;
      --paper: #fff;
      --soft: #edf1f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100dvh; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .58; }
    button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid #8ba0c4; outline-offset: 3px; }
    .shell { width: min(100%, 1000px); height: 100dvh; margin: auto; padding: 0 34px; display: flex; flex-direction: column; }
    header { min-height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 4px; background: var(--brand-dark); color: white; font-family: Baskerville, Georgia, serif; font-size: 25px; }
    .brand strong { display: block; color: var(--ink); font-size: 16px; font-weight: 700; }
    .brand small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .12em; }
    .reset { min-height: 40px; padding: 0 14px; border: 1px solid #c3ccda; border-radius: 4px; color: var(--brand-dark); background: transparent; font-size: 13px; font-weight: 650; white-space: nowrap; transition: background .16s ease, border-color .16s ease; }
    .reset:hover { border-color: var(--brand); background: var(--soft); }
    main { min-height: 0; flex: 1; overflow-y: auto; padding: 36px 8px; scrollbar-color: #bdcec8 transparent; }
    .welcome { max-width: 660px; margin: clamp(36px, 8vh, 90px) auto 48px; animation: arrive .38s ease-out both; }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .15em; }
    h1 { max-width: 560px; margin: 14px 0 12px; color: var(--ink); font-family: Baskerville, Georgia, serif; font-size: 42px; font-weight: 500; line-height: 1.12; }
    .welcome p { max-width: 520px; margin: 0; color: #647572; font-size: 15px; line-height: 1.7; }
    .suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 27px; }
    .suggestion { min-height: 68px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: #314846; text-align: left; font-size: 13px; line-height: 1.5; transition: border-color .16s ease, transform .16s ease, background .16s ease; }
    .suggestion:hover { transform: translateY(-1px); border-color: #91a2c1; background: #fbfcfe; }
    .message { max-width: 760px; margin: 0 auto 22px; animation: arrive .24s ease-out both; }
    .message .label { margin-bottom: 7px; color: var(--brand); font-size: 10px; font-weight: 750; letter-spacing: .12em; }
    .message .body { color: #263b39; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.75; }
    .table-scroll { max-width: 100%; overflow-x: auto; margin: 12px 0; white-space: normal; }
    .table-scroll:focus-visible { outline: 2px solid var(--brand); }
    .table-scroll table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table-scroll th, .table-scroll td { padding: 9px 12px; border: 1px solid #d8dfeb; text-align: left; vertical-align: top; min-width: 120px; }
    .table-scroll th { background: #edf1f7; font-weight: 700; }
    .message.user { max-width: min(76%, 590px); margin-right: max(0px, calc((100% - 760px) / 2)); padding: 13px 16px; border: 1px solid #d8dfeb; border-radius: 4px; background: #edf1f7; }
    .message.user .label { color: #52617d; }
    .message.assistant { padding: 8px 18px 8px 16px; border-left: 2px solid var(--accent); }
    .pending .body { color: var(--muted); }
    footer { padding: 14px 0 18px; border-top: 1px solid var(--line); background: #f3f6f4; }
    form { display: flex; align-items: flex-end; gap: 10px; max-width: 820px; margin: auto; padding: 8px; border: 1px solid #ccd3df; border-radius: 5px; background: var(--paper); box-shadow: 0 3px 12px #2033330a; }
    form:focus-within { border-color: #7f91b3; box-shadow: 0 0 0 3px #192f5912; }
    textarea { min-width: 0; min-height: 46px; max-height: 100px; flex: 1; resize: none; border: 0; padding: 11px 10px; outline: 0; background: transparent; color: var(--ink); font-size: 14px; line-height: 1.5; }
    textarea::placeholder { color: #899792; }
    .send { min-height: 42px; padding: 0 19px; border: 0; border-radius: 4px; background: var(--brand); color: white; font-size: 13px; font-weight: 700; transition: background .16s ease; }
    .send:hover:not(:disabled) { background: var(--brand-dark); }
    .meta { display: flex; justify-content: space-between; gap: 12px; max-width: 820px; margin: 9px auto 0; color: #788783; font-size: 11px; }
    .meta a { color: #445573; text-decoration-color: #b2bfd2; text-underline-offset: 2px; }
    #error { max-width: 820px; margin: 0 auto 10px; color: #a14331; font-size: 13px; line-height: 1.5; }
    [hidden] { display: none !important; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 620px) {
      .shell { padding: 0 17px; }
      header { min-height: 74px; gap: 10px; }
      .brand { gap: 9px; }
      .brand-mark { width: 36px; height: 36px; font-size: 22px; }
      .brand strong { font-size: 14px; }
      .brand small { font-size: 8px; letter-spacing: .09em; }
      .reset { min-height: 36px; padding: 0 10px; font-size: 12px; }
      main { padding: 24px 1px; }
      .welcome { margin: 5vh auto 32px; }
      h1 { font-size: 36px; }
      .welcome p { font-size: 14px; }
      .suggestions { grid-template-columns: 1fr; gap: 8px; margin-top: 21px; }
      .suggestion { min-height: 54px; padding: 11px 13px; }
      .message.user { max-width: 88%; margin-right: 0; }
      .message.assistant { padding-right: 4px; }
      footer { padding-bottom: max(13px, env(safe-area-inset-bottom)); }
      .meta { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="brand-mark" aria-hidden="true">P</div><div><strong>ParagonU Assistant</strong><small>PARAGON INTERNATIONAL UNIVERSITY</small></div></div>
      <button type="button" class="reset" id="reset">New conversation</button>
    </header>
    <main id="conversation" aria-label="Conversation">
      <section class="welcome" id="welcome">
        <span class="eyebrow">YOUR UNIVERSITY, EXPLAINED</span>
        <h1>What would you like to know?</h1>
        <p>Ask about programs, departments, and study plans. You can ask follow-up questions as we go.</p>
        <div class="suggestions">
          <button class="suggestion" type="button">What programs does ParagonU offer?</button>
          <button class="suggestion" type="button">Tell me about computer science.</button>
          <button class="suggestion" type="button">What is the business administration study plan?</button>
          <button class="suggestion" type="button">Tell me about the engineering faculty.</button>
        </div>
      </section>
      <div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    </main>
    <footer>
      <p id="error" role="alert" hidden></p>
      <form id="form">
        <textarea id="question" rows="1" maxlength="2000" placeholder="Ask a university question…" aria-label="Your question" required></textarea>
        <button class="send" id="send" type="submit">Send</button>
      </form>
      <div class="meta"><span id="status" role="status">History stays in this tab · Enter to send, Shift+Enter for a new line</span><a href="/docs">API docs</a></div>
    </footer>
  </div>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('question');
    const messages = document.getElementById('messages');
    const welcome = document.getElementById('welcome');
    const reset = document.getElementById('reset');
    const send = document.getElementById('send');
    const status = document.getElementById('status');
    const error = document.getElementById('error');
    const conversation = document.getElementById('conversation');
    const idleStatus = status.textContent;
    let history = [];
    let busy = false;

    function scrollToEnd() { conversation.scrollTop = conversation.scrollHeight; }

    // Build DOM nodes from text only: model output never becomes executable HTML.
    function appendInline(parent, text) {
      text.split(/(\*\*[^*]+\*\*)/g).forEach(part => {
        if (part.startsWith('**') && part.endsWith('**') && part.length > 4) {
          const strong = document.createElement('strong');
          strong.textContent = part.slice(2, -2);
          parent.append(strong);
        } else {
          parent.append(document.createTextNode(part));
        }
      });
    }

    function tableCells(line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
    }

    function renderAnswer(body, content) {
      const lines = content.replace(/\r\n?/g, '\n').split('\n');
      for (let i = 0; i < lines.length;) {
        const headers = tableCells(lines[i]);
        const separators = i + 1 < lines.length ? tableCells(lines[i + 1]) : [];
        if (lines[i].includes('|') && headers.length > 1 &&
            separators.length === headers.length && separators.every(cell => /^:?-{3,}:?$/.test(cell))) {
          const wrapper = document.createElement('div');
          wrapper.className = 'table-scroll';
          wrapper.tabIndex = 0;
          wrapper.setAttribute('role', 'region');
          wrapper.setAttribute('aria-label', 'Answer table');
          const table = document.createElement('table');
          const head = table.createTHead().insertRow();
          headers.forEach(header => {
            const cell = document.createElement('th');
            cell.scope = 'col';
            appendInline(cell, header);
            head.append(cell);
          });
          const tbody = table.createTBody();
          i += 2;
          while (i < lines.length && lines[i].includes('|') && tableCells(lines[i]).length === headers.length) {
            const row = tbody.insertRow();
            tableCells(lines[i]).forEach((value, column) => {
              const cell = row.insertCell();
              if (separators[column].endsWith(':')) {
                cell.style.textAlign = separators[column].startsWith(':') ? 'center' : 'right';
              }
              appendInline(cell, value);
            });
            i++;
          }
          wrapper.append(table);
          body.append(wrapper);
        } else {
          appendInline(body, lines[i]);
          if (i < lines.length - 1) body.append(document.createTextNode('\n'));
          i++;
        }
      }
    }

    function addMessage(role, content) {
      const article = document.createElement('article');
      article.className = 'message ' + role;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = role === 'user' ? 'YOU' : 'PARAGONU ASSISTANT';
      const body = document.createElement('div');
      body.className = 'body';
      if (role === 'assistant') renderAnswer(body, content);
      else body.textContent = content;
      article.append(label, body);
      messages.append(article);
      scrollToEnd();
      return article;
    }
    function setBusy(value) {
      busy = value;
      send.disabled = value;
      reset.disabled = value;
      input.disabled = value;
      document.querySelectorAll('.suggestion').forEach(button => button.disabled = value);
      send.textContent = value ? 'Waiting…' : 'Send';
      status.textContent = value ? 'Preparing your answer…' : idleStatus;
      messages.setAttribute('aria-busy', String(value));
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || busy) return;
      error.hidden = true;
      welcome.hidden = true;
      const userMessage = addMessage('user', question);
      const pending = addMessage('assistant', 'Finding university information…');
      pending.classList.add('pending');
      input.value = '';
      setBusy(true);
      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question, history})
        });
        if (!response.ok) {
          let detail;
          try { detail = (await response.json()).detail; } catch (_) {}
          throw new Error(typeof detail === 'string' ? detail : 'The request failed. Please try again.');
        }
        const data = await response.json();
        pending.remove();
        addMessage('assistant', data.answer);
        history = data.history;
      } catch (failure) {
        pending.remove();
        userMessage.remove();
        input.value = question;
        error.textContent = failure.message || 'Unable to connect. Please try again.';
        error.hidden = false;
        welcome.hidden = messages.childElementCount > 0;
      } finally {
        setBusy(false);
        input.focus();
        scrollToEnd();
      }
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    reset.addEventListener('click', () => {
      if (busy) return;
      history = [];
      messages.replaceChildren();
      welcome.hidden = false;
      error.hidden = true;
      input.value = '';
      input.focus();
    });
    document.querySelectorAll('.suggestion').forEach(button => {
      button.addEventListener('click', () => {
        if (busy) return;
        input.value = button.textContent;
        form.requestSubmit();
      });
    });
  </script>
</body>
</html>
